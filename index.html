<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arsalan Premium Barber</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-x:hidden;
}

/* Main website */
.website{
    position:relative;
    width:100%;
    max-width:720px;
    background:#000;
}

/* Exact first design image */
.main-image{
    display:block;
    width:100%;
    height:auto;
}

/*
================================================
CLICKABLE AREAS
================================================
*/

/* Home */
.home-link{
    position:absolute;
    top:3.1%;
    left:36%;
    width:9%;
    height:3%;
}

/* Services */
.services-link{
    position:absolute;
    top:3.1%;
    left:48%;
    width:11%;
    height:3%;
}

/* About */
.about-link{
    position:absolute;
    top:3.1%;
    left:63%;
    width:9%;
    height:3%;
}

/* Contact */
.contact-link{
    position:absolute;
    top:3.1%;
    left:75%;
    width:10%;
    height:3%;
}

/* Menu */
.menu-link{
    position:absolute;
    top:2.7%;
    right:3%;
    width:7%;
    height:4%;
}

/* BOOK NOW */
.book-now{
    position:absolute;
    top:72.2%;
    left:20%;
    width:60%;
    height:7%;
    
    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    color:transparent;

    cursor:pointer;
}

/*
================================================
RESPONSIVE
================================================
*/

@media (max-width:480px){

    .website{
        width:100%;
    }

}

@media (min-width:481px){

    .website{
        max-width:720px;
    }

}

</style>
</head>

<body>

<div class="website">

    <!-- EXACT FIRST IMAGE -->
    <img 
        src="IMG_0042.jpeg"
        alt="Arsalan Premium Barber"
        class="main-image"
    >

    <!-- Navigation -->
    <a href="#" class="home-link" aria-label="Home"></a>

    <a href="#services" class="services-link" aria-label="Services"></a>

    <a href="#about" class="about-link" aria-label="About"></a>

    <a href="#contact" class="contact-link" aria-label="Contact"></a>

    <!-- Menu -->
    <a href="#menu" class="menu-link" aria-label="Menu"></a>

    <!-- WhatsApp BOOK NOW -->
    <a
        href="https://wa.me/212617375671?text=Hello%20Arsalan%2C%20I%20would%20like%20to%20book%20an%20appointment."
        target="_blank"
        class="book-now"
        aria-label="Book appointment on WhatsApp">
    </a>

</div>

</body>
</html>
