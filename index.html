<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan - Premium Barber</title>
    <!-- استدعاء خطوط أنيقة من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0805;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
        }

        /* حاوية التصميم الكلية */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle, #1a140c 0%, #080604 100%);
            border: 15px solid #141008;
            border-image: linear-gradient(to bottom, #d4af37, #4a3b11) 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
            text-align: center;
        }

        /* شريط التنقل العلوي */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
        }

        .logo-small {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #d4af37;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #fff;
        }

        .menu-icon {
            display: none;
            font-size: 22px;
            color: #d4af37;
            cursor: pointer;
        }

        /* المحتوى الرئيسي */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: auto;
            padding: 20px 0;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 55px;
            font-weight: 700;
            background: linear-gradient(to bottom, #fff 20%, #d4af37 60%, #5a4510 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 15px rgba(0,0,0,0.9);
            margin-bottom: 15px;
        }

        .logo-graphic {
            font-size: 80px;
            color: #d4af37;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 4px;
            color: #d4af37;
            margin: 10px 0;
            font-weight: 600;
        }

        .divider {
            color: #d4af37;
            font-size: 14px;
            margin: 10px 0 20px;
            letter-spacing: 5px;
        }

        .description {
            font-size: 16px;
            color: #c5b358;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        /* زر الحجز */
        .book-btn {
            background: linear-gradient(to bottom, #e6c659 0%, #b8860b 50%, #614808 100%);
            color: #110d05;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            padding: 14px 45px;
            border: 2px solid #ffdf73;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .book-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        /* تذييل الميزات (الخدمات الأربع بالأسفل) */
        .features-footer {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 25px;
            margin-top: 20px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .feature-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(212, 175, 55, 0.3);
        }

        .feature-item i {
            font-size: 24px;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .feature-item span {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: #d4af37;
            letter-spacing: 1px;
            text-align: center;
        }

        /* التجاوب مع الهواتف والشاشات الصغيرة */
        @media (max-width: 768px) {
            nav ul {
                display: none;
            }
            .menu-icon {
                display: block;
            }
            .brand-title {
                font-size: 40px;
            }
            .features-footer {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .feature-item:nth-child(2)::after {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <!-- شريط التنقل -->
        <header>
            <div class="logo-small">Arsalan</div>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            <div class="menu-icon">
                <i class="fas fa-bars"></i>
            </div>
        </header>

        <!-- المحتوى الأساسي -->
        <div class="main-content">
            <h1 class="brand-title">Arsalan</h1>
            <div class="logo-graphic">
                <i class="fas fa-crown"></i>
            </div>
            <div class="subtitle">PREMIUM BARBER</div>
            <div class="divider">♦ ❖ ♦</div>
            <p class="description">
                Precision grooming. Premium style. Professional barbering in Casablanca.
            </p>
            <button class="book-btn">BOOK NOW</button>
        </div>

        <!-- الأيقونات والخدمات السفلى -->
        <div class="features-footer">
            <div class="feature-item">
                <i class="fas fa-crown"></i>
                <span>PREMIUM SERVICE</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-cut"></i>
                <span>EXPERT BARBERS</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-pump-soap"></i>
                <span>QUALITY PRODUCTS</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-clock"></i>
                <span>ON TIME SERVICE</span>
            </div>
        </div>
    </div>

</body>
</html>
