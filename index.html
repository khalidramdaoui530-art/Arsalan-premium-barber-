<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan Premium Barber</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0805;
            color: #d4af37;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #14100b 0%, #050403 100%);
            border: 2px solid #b39736;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }
        .logo-img {
            max-width: 180px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(179, 151, 54, 0.4));
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: #e6c552;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(to right, transparent, #b39736, transparent);
            margin: 15px auto;
        }
        p {
            font-size: 14px;
            color: #c5b493;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        .book-btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(to bottom, #d4af37, #997a15);
            color: #050403;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            text-decoration: none;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        .book-btn:hover {
            background: linear-gradient(to bottom, #e6c552, #b39736);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }
        .features {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(179, 151, 54, 0.3);
            padding-top: 25px;
        }
        .feature-item {
            flex: 1;
            text-align: center;
            padding: 0 5px;
        }
        .feature-item img {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            filter: sepia(1) hue-rotate(5deg) saturate(3);
        }
        .feature-item span {
            display: block;
            font-size: 10px;
            color: #bfa77a;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo / Brand Symbol -->
        <!-- استبدل الرابط أدناه برابط صورتك إذا رغبت -->
        <svg class="logo-img" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
            <!-- رمز تقريبي للتاج والمقص والشعار الذهبي -->
            <path d="M100,10 L120,40 L160,35 L135,65 L150,100 L100,80 L50,100 L65,65 L40,35 L80,40 Z" fill="none" stroke="#d4af37" stroke-width="2"/>
        </svg>

        <h1>Premium Barber</h1>
        <div class="divider"></div>
        
        <p>Precision grooming. Premium style. Professional barbering in Casablanca.</p>

        <!-- زر الحجز المرتبط برقم الهاتف المطلوب -->
        <a href="tel:+212617375671" class="book-btn">Book Now</a>

        <!-- المميزات في الأسفل -->
        <div class="features">
            <div class="feature-item">
                <div style="font-size: 20px;">👑</div>
                <span>Premium Service</span>
            </div>
            <div class="feature-item">
                <div style="font-size: 20px;">✂️</div>
                <span>Expert Barbers</span>
            </div>
            <div class="feature-item">
                <div style="font-size: 20px;">🧴</div>
                <span>Quality Products</span>
            </div>
            <div class="feature-item">
                <div style="font-size: 20px;">⏱️</div>
                <span>On Time Service</span>
            </div>
        </div>
    </div>

</body>
</html>
