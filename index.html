<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan - Premium Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@0,600;0,900;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #15120e 0%, #050505 100%);
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo-header {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff2b2, #d4af37, #996515);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #b3b3b3;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            font-family: sans-serif;
        }

        nav ul li a:hover {
            color: #d4af37;
        }

        /* المحتوى الرئيسي */
        .main-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 140px 20px 50px 20px;
        }

        /* العنوان الرئيسي الضخم */
        .hero-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff, #f3e5ab, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        /* شارات وزخرفة ملكية بديلة للصورة */
        .crest-box {
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 15px 30px;
            margin: 15px 0;
            background: rgba(212, 175, 55, 0.03);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .crest-symbol {
            font-size: 2.5rem;
            color: #d4af37;
            margin-bottom: 5px;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            letter-spacing: 5px;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 20px;
            font-family: sans-serif;
            text-transform: uppercase;
        }

        .hero-description {
            font-size: 1.2rem;
            color: #bcbcbc;
            max-width: 550px;
            line-height: 1.7;
            margin-bottom: 35px;
            font-style: italic;
        }

        /* زر الحجز */
        .btn-booking {
            display: inline-block;
            padding: 16px 45px;
            background: linear-gradient(to bottom, #ffd700, #b8860b, #8b6508);
            color: #050505;
            text-decoration: none;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            font-family: sans-serif;
        }

        .btn-booking:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            background: linear-gradient(to bottom, #fff, #ffd700, #b8860b);
        }

        /* شريط المميزات السفلي */
        .features-bar {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding: 30px 20px;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            margin-top: auto;
        }

        .feature-item {
            text-align: center;
            color: #b3b3b3;
        }

        .feature-item .icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .feature-item p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: sans-serif;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav ul { gap: 12px; font-size: 0.75rem; }
            .hero-title { font-size: 3rem; }
            .features-bar { gap: 20px; padding: 20px 10px; }
            .feature-item p { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-header">Arsalan</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-hero">
        <h1 class="hero-title">Arsalan</h1>
        
        <div class="crest-box">
            <div class="crest-symbol">👑 ✂️</div>
        </div>

        <h2 class="hero-subtitle">Premium Barber</h2>

        <p class="hero-description">
            Precision grooming. Premium style. Professional barbering in premium barber.
        </p>

        <a href="#book" class="btn-booking">Book Now</a>
    </main>

    <section class="features-bar">
        <div class="feature-item">
            <div class="icon">👑</div>
            <p>Premium Service</p>
        </div>
        <div class="feature-item">
            <div class="icon">✂️</div>
            <p>Expert Barbers</p>
        </div>
        <div class="feature-item">
            <div class="icon">🧴</div>
            <p>Quality Products</p>
        </div>
        <div class="feature-item">
            <div class="icon">⏱️</div>
            <p>On Time Service</p>
        </div>
    </section>

</body>
</html>
