<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSALAN | Premium Barber</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Playfair Display',serif;
    background:#000;
}

.video-background{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

header{
    width:100%;
    max-width:1200px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

.logo{
    font-family:'Cinzel',serif;
    font-size:2rem;
    color:#d4af37;
    font-weight:bold;
}

nav a{
    color:#d4af37;
    text-decoration:none;
    margin-left:20px;
    transition:.3s;
}

nav a:hover{
    color:#fff;
}

.main-content{
    text-align:center;
    max-width:700px;
}

.hero-image img{
    width:340px;
    max-width:90%;
    border-radius:20px;
    border:4px solid #d4af37;
    box-shadow:0 15px 40px rgba(212,175,55,.45);
    margin-bottom:30px;
}

.brand-title{
    font-family:'Cinzel',serif;
    font-size:3.2rem;
    color:#d4af37;
}

.brand-subtitle{
    color:#fff;
    margin:15px 0;
    letter-spacing:2px;
}

.description{
    color:#d4af37;
    margin-bottom:30px;
    line-height:1.7;
}

.book-btn{
    display:inline-block;
    background:linear-gradient(135deg,#d4af37,#aa820a);
    color:#111;
    text-decoration:none;
    padding:15px 40px;
    border-radius:5px;
    font-weight:bold;
    transition:.3s;
}

.book-btn:hover{
    transform:translateY(-3px);
}

footer{
    color:#ccc;
    margin-bottom:20px;
}

@media(max-width:768px){

header{
flex-direction:column;
}

.brand-title{
font-size:2.3rem;
}

.hero-image img{
width:250px;
}

}
</style>
</head>

<body>

<video autoplay muted loop playsinline class="video-background">

<source src="https://raw.githubusercontent.com/khalidramdaoui530-art/Arsalan-premium-barber-/main/gemini_generated_video_C81661A4.mp4" type="video/mp4">

</video>

<div class="overlay">

<header>

<div class="logo">
ARSALAN
</div>

<nav>

<a href="#">Services</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

</header>

<div class="main-content">

<div class="hero-image">

<img src="https://raw.githubusercontent.com/khalidramdaoui530-art/Arsalan-premium-barber-/main/B552DA39-9ECA-4720-BA1E-8FBDF47EA9E1.png" alt="ARSALAN">

</div>

<h1 class="brand-title">ARSALAN</h1>

<div class="brand-subtitle">
PREMIUM BARBER
</div>

<p class="description">
Precision grooming. Premium style. Professional barbering.
</p>

<a class="book-btn" href="https://wa.me/">
BOOK NOW
</a></div>

<footer>
    &copy; 2026 Arsalan Barbershop. All Rights Reserved.
</footer>

</div>

</body>
</html>
