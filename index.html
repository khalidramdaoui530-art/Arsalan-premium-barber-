<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan - Premium Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0805;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-frame {
            width: 100%;
            max-width: 414px;
            background: linear-gradient(135deg, #120e09 0%, #050403 50%, #0b0805 100%);
            border: 12px solid #1a1510;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.1);
            position: relative;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .logo-small {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #c5a028;
            font-size: 13px;
            font-family: 'Cinzel', serif;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #fff;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 30px 20px 40px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(to bottom, #f3e5ab 0%, #c5a028 50%, #8a6f1d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .emblem-container {
            margin: 15px auto 20px;
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .emblem-container i {
            font-size: 90px;
            background: linear-gradient(to bottom, #f3e5ab, #997a15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7));
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 3px;
            color: #d4af37;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .ornament-divider {
            color: #c5a028;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #bfa878;
            max-width: 300px;
            margin: 0 auto 30px;
        }

        /* Book Button */
        .book-btn {
            display: inline-block;
            width: 85%;
            padding: 14px 0;
            background: linear-gradient(to bottom, #e6c66d 0%, #b89228 50%, #806012 100%);
            color: #0d0a06;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            border: 1px solid #5a430a;
            transition: transform 0.2s;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .book-btn:active {
            transform: scale(0.98);
        }

        /* Features Footer Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(10, 8, 5, 0.6);
            padding: 20px 5px;
        }

        .feature-item {
            text-align: center;
            padding: 0 5px;
            border-right: 1px solid rgba(212, 175, 55, 0.1);
        }

        .feature-item:last-child {
            border-right: none;
        }

        .feature-item i {
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .feature-item span {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 9px;
            color: #bfa878;
            line-height: 1.2;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            nav ul {
                display: none;
            }
            .menu-btn {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Header -->
        <header>
            <div class="logo-small">Arsalan</div>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        </header>

        <!-- Hero Content -->
        <section class="hero">
            <h1 class="main-title">Arsalan</h1>
            
            <div class="emblem-container">
                <i class="fa-solid fa-crown"></i>
            </div>

            <div class="subtitle">PREMIUM BARBER</div>
            
            <div class="ornament-divider">❖ ❦ ❖</div>

            <p class="description">
                Precision grooming. Premium style. Professional barbering in Casablanca.
            </p>

            <a href="#" class="book-btn">BOOK NOW</a>
        </section>

        <!-- Features Grid -->
        <div class="features-grid">
            <div class="feature-item">
                <i class="fa-solid fa-crown"></i>
                <span>PREMIUM SERVICE</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-scissors"></i>
                <span>EXPERT BARBERS</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-spray-can"></i>
                <span>QUALITY PRODUCTS</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-clock"></i>
                <span>ON TIME SERVICE</span>
            </div>
        </div>
    </div>

</body>
</html>
