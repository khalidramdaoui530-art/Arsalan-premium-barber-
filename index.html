<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan - Premium Barber</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #d4af37;
            font-family: 'Cinzel', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية تحاكي شاشة الهاتف لتظهر الصورة بكامل تفاصيلها الفخمة */
        .phone-container {
            width: 100%;
            max-width: 430px;
            background-color: #050505;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* عرض الصورة الأصلية كاملة لضمان التطابق التام */
        .exact-image {
            width: 100%;
            display: block;
            height: auto;
        }

        /* زر الحجز التفاعلي فوق مكان زر الصورة بالضبط */
        .interactive-book-btn {
            position: absolute;
            bottom: 20.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 7.5%;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        /* تأثير عند تمرير الفأرة أو الضغط */
        .interactive-book-btn:active {
            background: rgba(212, 175, 55, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- الصورة الأصلية الكاملة التي طالبت بها -->
        <img src="image.png" alt="Arsalan Premium Barber Interface" class="exact-image">
        
        <!-- زر حجز تفاعلي يعمل عند الضغط عليه -->
        <a href="#booking" class="interactive-book-btn" title="Book Now"></a>
    </div>

</body>
</html>
