<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan - Premium Barber</title>
    <!-- استيراد خطوط فيكتورية ملكية تشبه الصورة الأصلية -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #181510 0%, #050505 100%);
            color: #d4af37;
            font-family: 'Cinzel', serif;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- الهيدر العلوي --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            background: rgba(5, 5, 5, 0.9);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff2b2, #d4af37, #996515);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            text-decoration: none;
            color: #b3b3b3;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        /* --- القسم الرئيسي (Hero) --- */
        .main-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 160px 20px 60px 20px;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 5.5rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff, #f3e5ab, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* الصورة المزخرفة (الشعار الأوسط) */
        .hero-logo-graphic {
            width: 340px;
            height: auto;
            margin: 5px 0 15px 0;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
        }

        .hero-subtitle {
            font-size: 1.15rem;
            letter-spacing: 6px;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .hero-description {
            font-size: 1.25rem;
            color: #c0c0c0;
            max-width: 580px;
            line-height: 1.8;
            margin-bottom: 40px;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        /* زر الحجز الفاخر */
        .btn-booking {
            display: inline-block;
            padding: 18px 50px;
            background: linear-gradient(to bottom, #ffd700, #b8860b, #8b6508);
            color: #050505;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 4px;
            transition: all 0.4s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.35);
            border: 1px solid #ffea85;
        }

        .btn-booking:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
            background: linear-gradient(to bottom, #fff, #ffd700, #b8860b);
        }

        /* --- الشريط السفلي للمميزات --- */
        .features-bar {
            display: flex;
            justify-content: center;
            gap: 70px;
            padding: 40px 20px;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            margin-top: auto;
        }

        .feature-item {
            text-align: center;
            color: #b3b3b3;
        }

        .feature-item img.icon-img {
            width: 38px;
            height: 38px;
            margin-bottom: 10px;
            filter: brightness(0) saturate(100%) invert(75%) sepia(48%) saturate(452%) hue-rotate(5deg) brightness(91%) contrast(88%);
        }

        .feature-item p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* --- التصميم المتجاوب للهواتف --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            nav ul {
                gap: 15px;
                font-size: 0.8rem;
            }
            .hero-title {
                font-size: 3.2rem;
            }
            .hero-logo-graphic {
                width: 230px;
            }
            .hero-description {
                font-size: 1.05rem;
                padding: 0 15px;
            }
            .features-bar {
                gap: 25px;
                padding: 25px 10px;
            }
            .feature-item img.icon-img {
                width: 28px;
                height: 28px;
            }
            .feature-item p {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <header>
        <div class="logo-text">Arsalan</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-hero">
        <h1 class="hero-title">Arsalan</h1>

        <!-- صورة الشعار المزخرف (تأكد من وضع ملف الصورة بنفس المجلد باسم logo_graphic.png) -->
        <img src="logo_graphic.png" alt="Arsalan Crest" class="hero-logo-graphic">

        <h2 class="hero-subtitle">PREMIUM BARBER</h2>

        <p class="hero-description">
            Precision grooming. Premium style. Professional barbering in premium barber.
        </p>

        <a href="#book" class="btn-booking">Book Now</a>
    </main>

    <!-- شريط الأيقونات السفلية -->
    <section class="features-bar">
        <div class="feature-item">
            <img src="https://img.icons8.com/fluency-systems-regular/48/c5a059/crown.png" alt="Crown" class="icon-img">
            <p>Premium Service</p>
        </div>
        <div class="feature-item">
            <img src="https://img.icons8.com/fluency-systems-regular/48/c5a059/straight-razor.png" alt="Razor" class="icon-img">
            <p>Expert Barbers</p>
        </div>
        <div class="feature-item">
            <img src="https://img.icons8.com/fluency-systems-regular/48/c5a059/lotion.png" alt="Product" class="icon-img">
            <p>Quality Products</p>
        </div>
        <div class="feature-item">
            <img src="https://img.icons8.com/fluency-systems-regular/48/c5a059/clock--v1.png" alt="Clock" class="icon-img">
            <p>On Time Service</p>
        </div>
    </section>

</body>
</html>
