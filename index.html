<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan - Premium Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="website-container">
        <header class="navbar">
            <div class="logo-text">Arsalan</div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
            <div class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>

        <main class="hero-section">
            <div class="corner-ornament top-left"></div>
            <div class="corner-ornament top-right"></div>
            
            <div class="hero-content">
                <h1 class="main-title">Arsalan</h1>
                
                <div class="emblem-container">
                    <div class="ornament-graphic">
                        <i class="fa-solid fa-scissors sciss"></i>
                        <span class="central-letter">A</span>
                        <div class="barber-pole"></div>
                    </div>
                </div>

                <h2 class="subtitle">PREMIUM BARBER</h2>
                
                <p class="description">
                    Precision grooming. Premium style. Professional barbering in Casablanca.
                </p>

                <a href="#book" class="book-btn">BOOK NOW</a>

                <div class="features-bar">
                    <div class="feature-item">
                        <i class="fa-solid fa-crown"></i>
                        <span>PREMIUM SERVICE</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>EXPERT BARBERS</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-bottle-droplet"></i>
                        <span>QUALITY PRODUCTS</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-clock"></i>
                        <span>ON TIME SERVICE</span>
                    </div>
                </div>
            </div>

            <div class="corner-ornament bottom-left"></div>
            <div class="corner-ornament bottom-right"></div>
        </main>
    </div>

</body>
</html>
